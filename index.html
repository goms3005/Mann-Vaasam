<!DOCTYPE html>
<html>

<head>
    <title>Project-2 Mann Vaasam</title>
    <!-- Icon Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Responsive Link -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- External Link -->
    <link rel="stylesheet" type="text/css" href="./index.css" />
</head>

<body>
    <!-- Overall Container -->
    <div class="container">
        <!-------------------------------------- Navigation Bar ----------------------------------->
        <nav>
            <!-- Overall Nav -->
            <div class="full-nav">
                <!-- Left-side Nav  -->
                <div class="left-nav">
                    <div>
                        <img class="mann-img" src="mann-vaasam-icon.png" alt="Image Not Found">
                        <p class="mann-txt-1">Mann Vaasam</p>
                    </div>
                    <p class="mann">Mann Vaasam</p>
                </div>
                <!-- Right-side Nav -->
                <div class="right-nav">
                    <!-- search box + search icon -->
                    <div class="search-box">
                        <!-- searchbox -->
                        <input id="search" type="search" name="searchbox" placeholder="Search..." />
                        <!-- search icon -->
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    </div>
                    <i onclick="menu()" class="fa-solid fa-bars menu"></i>
                    <!-- Overall anchor + icon + login -->
                    <div class="overall-anchor-icon-login">
                        <!-- Anchor tags -->
                        <div class="anchor">
                            <a>Home</a>
                            <a>Product</a>
                            <a>About</a>
                            <a>Contact</a>
                            <i class="fa-solid fa-cart-shopping"></i>
                        </div>
                        <!-- login button -->
                        <button class="login-button">Login/Signup</button>
                    </div>
                </div>
            </div>
        </nav>
        <!------------------------------ Home Section ----------------------------------->
        <div class="home-section">
            <div class="home-txt">
                <div class="natural">
                    <p>100% Natural</p>
                </div>
                <div class="title">
                    <div>
                        <p class="heading">Mann Vaasam</p>
                        <p class="sub-heading">Direct from Farm to Home</p>
                    </div>
                    <div>
                        <p class="des">Experience the freshness of hand-picked vegetables and fruits, delivered straight from
                        our fields to your doorstep - no middlemen, no chemicals.</p>
                    </div>
                    <div class="btn">
                        <button>Shop Now</button>
                        <button>Explore Products</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="./index.js">

    </script>
</body>

</html>
